services:
  postgres:
    image: postgres:17
    container_name: temp-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tempmail
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - temp_mail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempmail -d tempmail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  temp_mail_pgdata:
